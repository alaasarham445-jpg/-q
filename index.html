:root{--bg:#E2EAE4;--card:#F0F5F1;--tx:#1B2E25;--mu:#4A6355;--ac:#2F7A4A;--ink:#fff;--line:#C3D1C8;--track:#C9D8CE;--bar:#B5C7BB;--sh:0 1px 6px rgba(30,60,45,.08);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1F1A;--card:#16302A;--tx:#EAF2EC;--mu:#9DB5A8;--ac:#B8F26B;--ink:#0F1F1A;--line:#24473F;--track:#16302A;--bar:#24473F;--sh:none}}
:root[data-theme="dark"]{--bg:#0F1F1A;--card:#16302A;--tx:#EAF2EC;--mu:#9DB5A8;--ac:#B8F26B;--ink:#0F1F1A;--line:#24473F;--track:#16302A;--bar:#24473F;--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--tx);font-family:'Cairo','KhA',Tahoma,'Segoe UI',system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
main{max-width:520px;margin:0 auto;padding:16px 18px 110px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:24px;font-weight:800}
h2{margin:0;font-size:16px;font-weight:700}
.row{display:flex;gap:10px}.sp{justify-content:space-between;align-items:center}
.card{background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);border-radius:18px;padding:14px}
.m{flex:1;text-align:center;padding:12px 6px}
.m b{display:block;font-size:22px;font-weight:800}.m span{font-size:12px;color:var(--mu)}
.mu{color:var(--mu);font-size:13px}
.pill{background:var(--card);border:1px solid var(--line);color:var(--ac);border-radius:20px;padding:6px 14px;font-size:13px}
button{font:inherit;min-height:52px;border:1px solid var(--line);border-radius:28px;padding:0 20px;cursor:pointer;font-weight:700;font-size:16px;background:var(--card);color:var(--tx)}
button.p{background:var(--ac);color:var(--ink);border-color:transparent}button.p:disabled{opacity:.5}
button:focus:not(:focus-visible){outline:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
nav button:focus-visible{outline-offset:-3px}
.big{font-size:64px;font-weight:800;line-height:1;text-align:center}
nav{position:fixed;inset-inline:14px;max-width:420px;margin-inline:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--card);display:flex;gap:4px;padding:6px;border-radius:999px;border:1px solid var(--line);box-shadow:0 8px 24px rgba(10,40,25,.28)}
nav button{flex:1;border:0;position:relative;z-index:1;border-radius:999px;background:none;min-height:48px;padding:0 6px;font-size:14px;color:var(--mu);transition:color .3s}
nav button[aria-current="true"]{color:var(--ink);font-weight:800}
#ind{position:absolute;top:6px;bottom:6px;border-radius:999px;background:var(--ac);transition:left .35s cubic-bezier(.3,.9,.3,1),width .35s cubic-bezier(.3,.9,.3,1)}
@media (prefers-reduced-motion:reduce){#ind{transition:none}}
label{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15px}
input,textarea,select{font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:44px}
input{width:110px;text-align:center}textarea{width:100%;min-height:90px;direction:ltr;font-size:12px}
.bars{display:flex;gap:8px;align-items:flex-end;height:150px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;font-size:12px;color:var(--mu)}
.bars i{display:block;width:100%;border-radius:8px;background:var(--bar);transform-origin:bottom}.bars i.t{background:var(--ac)}
.badge{border:2px solid var(--ac);border-radius:12px;padding:8px 12px;font-size:13px}.badge.off{border-color:var(--line);color:var(--mu)}
.wrap{flex-wrap:wrap}
svg{display:block;max-width:100%}
@keyframes soft{from{opacity:0;transform:translateY(10px)}}
.t-home,.t-track,.t-stats,.t-set{animation:soft .28s ease-out both}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));inset-inline:16px;max-width:420px;margin-inline:auto;background:var(--ac);color:var(--ink);padding:12px 16px;border-radius:16px;font-weight:700;text-align:center;opacity:0;transform:translateY(-20px);pointer-events:none;transition:opacity .25s,transform .25s;z-index:5}
#toast.on{opacity:1;transform:none}
.g7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cd{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:13px}
.cd.f{background:var(--ac);color:var(--ink);font-weight:800}
.cd.h{background:var(--track)}
.cd.n{outline:2px solid var(--ac);outline-offset:1px}
select{min-width:110px}
@media (prefers-reduced-motion:reduce){#v,#v *{animation:none!important}}
.hd{display:flex;align-items:center;gap:12px}.lg{width:46px;height:46px;flex:none;filter:drop-shadow(0 2px 4px rgba(20,60,35,.25))}
nav button{display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<main id="v" aria-live="polite"></main>
<nav id="nav"></nav>
<script>
const K='walk_v1',$=s=>document.querySelector(s);
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{days:{},sessions:[],p:{w:70,goal:10000,stride:0.75}};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const dk=d=>(d||new Date()).toLocaleDateString('en-CA');
const day=k=>S.days[k]||(S.days[k]={steps:0,dist:0,secs:0});
const km=m=>(m/1000).toFixed(2);
const cal=m=>Math.round(0.53*S.p.w*m/1000);
const mmss=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60,p=n=>String(n).padStart(2,'0');return (h?h+':':'')+p(m)+':'+p(x)};
const T={on:0,pause:0,steps:0,dist:0,secs:0,last:null,path:[],motion:0,gps:'',w:null,t:null,lm:0,above:0};
let tab='home';
const IC={home:`<svg viewBox='0 0 24 24' width='24' height='24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z'/></svg>`,track:`<svg viewBox='0 0 24 24' width='24' height='24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z'/><circle cx='12' cy='10' r='2.5'/></svg>`,stats:`<svg viewBox='0 0 24 24' width='24' height='24' fill='none' stroke='currentColor' stroke-width='2.4' stroke-linecap='round'><path d='M5 21v-9M12 21V4M19 21v-6'/></svg>`,set:`<svg viewBox='0 0 24 24' width='24' height='24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round'><path d='M4 7h8M18 7h2M4 17h2M12 17h8'/><circle cx='15' cy='7' r='2.4'/><circle cx='9' cy='17' r='2.4'/></svg>`};
const TABS=[['home','الرئيسية'],['track','تتبع'],['stats','إحصائيات'],['set','الإعدادات']];

function hav(a,b){const R=6371000,r=x=>x*Math.PI/180,dl=r(b[0]-a[0]),dn=r(b[1]-a[1]);
const h=Math.sin(dl/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}

function onPos(p){
 if(T.pause||p.coords.accuracy>40){T.gps='إشارة GPS ضعيفة';return}
 const c=[p.coords.latitude,p.coords.longitude];T.gps='GPS يعمل';
 if(T.last){const d=hav(T.last,c);if(d>2&&d<100){T.dist+=d;T.path.push(c);T.last=c}}else{T.last=c;T.path.push(c)}
}
function onMot(e){
 if(T.pause)return;const a=e.accelerationIncludingGravity;if(!a)return;
 const m=Math.hypot(a.x||0,a.y||0,a.z||0),n=Date.now();T.motion=1;
 if(m>12&&!T.above&&n-T.lm>320){T.steps++;T.lm=n;T.above=1}else if(m<10.8)T.above=0;
}
async function start(){
 if(T.on)return;
 Object.assign(T,{on:1,pause:0,steps:0,dist:0,secs:0,last:null,path:[],motion:0,gps:'جارٍ تحديد الموقع…',g0:day(dk()).steps>=S.p.goal,gh:0,kmn:0});try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(l=>{T.wl=l}).catch(()=>{})}catch(e){}
 try{if(window.DeviceMotionEvent&&DeviceMotionEvent.requestPermission)await DeviceMotionEvent.requestPermission()}catch(e){}
 window.addEventListener('devicemotion',onMot);
 if(navigator.geolocation)T.w=navigator.geolocation.watchPosition(onPos,()=>{T.gps='تعذّر GPS، تُحسب الخطوات فقط'},{enableHighAccuracy:true,maximumAge:2000});
 else T.gps='GPS غير متاح';
 T.t=setInterval(()=>{if(!T.pause)T.secs++;if(!T.motion&&T.dist>0)T.steps=Math.round(T.dist/S.p.stride);
  if(!T.g0&&!T.gh&&day(dk()).steps+T.steps>=S.p.goal){T.gh=1;play('goal');toast('أحسنت! حققت هدف اليوم')}
  const kk=Math.floor(T.dist/1000);if(kk>T.kmn){T.kmn=kk;play('km')}
  if(tab==='track'||tab==='home')render(1)},1000);
 go('track');
}
function stop(){
 clearInterval(T.t);try{T.wl&&T.wl.release()}catch(e){}if(T.w!=null)navigator.geolocation.clearWatch(T.w);window.removeEventListener('devicemotion',onMot);
 if(T.steps>0||T.dist>0){
  const dist=T.dist||T.steps*S.p.stride,d=day(dk());d.steps+=T.steps;d.dist+=dist;d.secs+=T.secs;
  const st=Math.max(1,Math.ceil(T.path.length/150));
  S.sessions.unshift({t:Date.now(),steps:T.steps,dist,secs:T.secs,path:T.path.filter((_,i)=>i%st===0)});
  S.sessions=S.sessions.slice(0,100);save();chk();
 }
 T.on=0;T.w=null;go('stats');
}
let AC=null;
function note(f,t,d,v){v=Math.max(.0002,v*2*(S.p.vol??.5));const ty=S.p.tone||'sine',fs=ty==='bell'?[[f,1],[f*2.76,.25]]:[[f,1]];fs.forEach(x=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty==='triangle'?'triangle':'sine';o.frequency.value=x[0];g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,v*x[1]),t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.05)})}
const SEQ={tap:[[587.33,0,.25,.05]],start:[[392,0,.6,.07],[523.25,.13,.6,.07],[659.25,.26,.9,.07]],pause:[[440,0,.4,.06]],stop:[[659.25,0,.6,.07],[523.25,.15,.6,.07],[392,.3,1,.07]],km:[[523.25,0,.6,.07],[783.99,.16,.9,.07]],goal:[[523.25,0,.6,.08],[659.25,.14,.6,.08],[783.99,.28,.6,.08],[1046.5,.42,1.2,.08]],del:[[330,0,.35,.05]],ok:[[587.33,0,.3,.05],[740,.1,.5,.05]]};
function play(k,i){if(S.p.snd===false)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
 const t=AC.currentTime+.01,s=k==='tab'?[[[523.25,587.33,659.25,783.99][i]||523.25,0,.3,.05]]:SEQ[k]||SEQ.tap;s.forEach(n=>note(n[0],t+n[1],n[2],n[3]))}catch(e){}}
function go(t){tab=t;render();const v=$('#v');v.className='';void v.offsetWidth;v.className='t-'+t}

function ring(v,g){const c=502.65,f=Math.min(1,v/g)*c;
 return `<svg width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="${Math.round(v/g*100)}% من الهدف"><circle cx="100" cy="100" r="80" fill="none" stroke="var(--track)" stroke-width="16"/><circle cx="100" cy="100" r="80" fill="none" stroke="var(--ac)" stroke-width="16" stroke-linecap="round" stroke-dasharray="${f} ${c}" transform="rotate(-90 100 100)"/></svg>`}
function streak(){let n=0,d=new Date();if((S.days[dk(d)]||{steps:0}).steps<S.p.goal)d.setDate(d.getDate()-1);
 while((S.days[dk(d)]||{steps:0}).steps>=S.p.goal){n++;d.setDate(d.getDate()-1)}return n}
function m3(a,b,c){return `<div class="row"><div class="card m"><b>${a[0]}</b><span>${a[1]}</span></div><div class="card m"><b>${b[0]}</b><span>${b[1]}</span></div><div class="card m"><b>${c[0]}</b><span>${c[1]}</span></div></div>`}
function pathSvg(pts){
 if(pts.length<2)return `<div class="card mu" style="height:240px;display:flex;align-items:center;justify-content:center;text-align:center">ابدأ المشي ليظهر مسارك هنا</div>`;
 const la=pts.map(p=>p[0]),lo=pts.map(p=>p[1]),a=Math.min(...la),b=Math.max(...la),c=Math.min(...lo),d=Math.max(...lo);
 const s=Math.min(300/((d-c)*Math.cos(a*Math.PI/180)||1e-6),200/((b-a)||1e-6)),W=340,H=240;
 const xy=p=>[(W-(d-c)*Math.cos(a*Math.PI/180)*s)/2+(p[1]-c)*Math.cos(a*Math.PI/180)*s,H-(H-(b-a)*s)/2-(p[0]-a)*s];
 const q=pts.map(xy),e=q[q.length-1];
 return `<div class="card"><svg width="100%" viewBox="0 0 ${W} ${H}" role="img" aria-label="مسار المشي"><polyline points="${q.map(x=>x.join(',')).join(' ')}" fill="none" stroke="var(--ac)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${e[0]}" cy="${e[1]}" r="8" fill="var(--tx)"/></svg></div>`}

function vHome(){
 const d=day(dk()),steps=d.steps+(T.on?T.steps:0),dist=d.dist+(T.on?T.dist:0),secs=d.secs+(T.on?T.secs:0),g=S.p.goal;
 return `<div class="hd"><svg class='lg' viewBox='0 0 64 64' role='img' aria-label='شعار خطواتي'><defs><linearGradient id='bL' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#17613F'/><stop offset='1' stop-color='#072A1C'/></linearGradient><linearGradient id='gL' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#FBEBB0'/><stop offset='.5' stop-color='#D9AA4A'/><stop offset='1' stop-color='#A8761F'/></linearGradient></defs><rect width='64' height='64' rx='18' fill='url(#bL)'/><g fill='url(#gL)' transform='rotate(-8 32 32)'><ellipse cx='32' cy='26' rx='9.5' ry='12.5'/><ellipse cx='32' cy='46' rx='6.5' ry='6'/></g></svg><div><div class="mu">خطواتي · اليوم</div><h1>هدف الخطوات</h1></div></div>
 <div style="position:relative;width:200px;height:200px;margin:6px auto"><div>${ring(steps,g)}</div><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center"><b style="font-size:40px">${steps.toLocaleString('en')}</b><span class="mu">من ${g.toLocaleString('en')} خطوة</span></div></div>
 ${m3([km(dist),'كم'],[cal(dist),'سعرة'],[Math.round(secs/60),'دقيقة'])}
 <div class="card row sp"><span>سلسلة تحقيق الهدف</span><b style="color:var(--ac)">${streak()} يوماً</b></div>
 ${T.on?`<button class="p" data-a="track">العودة إلى الجلسة النشطة</button>`:`<button class="p" data-a="start">ابدأ المشي</button>`}`}

function vTrack(){
 if(!T.on)return `<h1>تتبع المشي</h1>${pathSvg([])}<p class="mu">يستخدم GPS وحساس الحركة في هاتفك، ولا يحتاج إنترنت. اسمح بالوصول للموقع عند الطلب.</p><button class="p" data-a="start">ابدأ المشي</button>`;
 const pace=T.dist>50?mmss(Math.round(T.secs/(T.dist/1000))):'--:--';
 return `<div class="row sp"><h1>جلسة نشطة</h1><span class="pill">${T.pause?'متوقفة مؤقتاً':T.gps}</span></div>
 ${pathSvg(T.path)}<div><div class="big">${km(T.dist)}</div><div class="mu" style="text-align:center">كيلومتر</div></div>
 ${m3([mmss(T.secs),'المدة'],[pace,'دقيقة/كم'],[T.steps,'خطوة'])}
 <div class="row"><button style="flex:1" data-a="pause">${T.pause?'استئناف':'إيقاف مؤقت'}</button><button class="p" style="flex:1" data-a="stop">إنهاء وحفظ</button></div>`}

function vStats(){
 const ds=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=dk(d);ds.push([k,(S.days[k]||{steps:0}).steps,d.toLocaleDateString('ar',{weekday:'short'})])}
 const mx=Math.max(1,...ds.map(x=>x[1])),tot=ds.reduce((a,x)=>a+x[1],0),best=Math.max(...ds.map(x=>x[1]));
 const all=Object.values(S.days).reduce((a,x)=>a+x.steps,0),far=Math.max(0,...S.sessions.map(s=>s.dist));
 const bd=[['جلسة 10 كم',far>=10000],['سلسلة 7 أيام',streak()>=7],['100 ألف خطوة',all>=1e5],['أول جلسة',S.sessions.length>0],['تحدٍّ مكتمل',(S.ch||[]).some(c=>c.fin)],['سلسلة 30 يوماً',streak()>=30],['مليون خطوة',all>=1e6]];
 return `<h1>الإحصائيات</h1><div class="card"><div class="mu">خطوات آخر 7 أيام</div><b style="font-size:30px">${tot.toLocaleString('en')}</b>
 <div class="bars" style="margin-top:10px">${ds.map(x=>`<div><i class="${x[0]===dk()?'t':''}" style="height:${Math.max(4,x[1]/mx*100)}%"></i>${x[2]}</div>`).join('')}</div></div>
 <div class="row"><div class="card m"><b>${best.toLocaleString('en')}</b><span>أفضل يوم</span></div><div class="card m"><b>${Math.round(tot/7).toLocaleString('en')}</b><span>المتوسط اليومي</span></div></div>
 <div class="card"><h2>الإنجازات</h2><div class="row wrap" style="margin-top:8px">${bd.map(b=>`<span class="badge ${b[1]?'':'off'}">${b[0]}</span>`).join('')}</div></div>${vCh()}${vCal()}
 <h2>آخر الجلسات</h2>${S.sessions.length?S.sessions.slice(0,6).map((s,i)=>`<div class="card row sp"><div><b>${km(s.dist)} كم</b><div class="mu">${new Date(s.t).toLocaleDateString('ar',{day:'numeric',month:'short'})} · ${mmss(s.secs)}</div></div><span>${s.steps} خطوة</span><button data-a="del" data-i="${i}" aria-label="حذف الجلسة" style="min-height:44px;padding:0 14px;font-size:14px">حذف</button></div>`).join(''):'<div class="card mu">لا توجد جلسات بعد. ابدأ أول مشي لك.</div>'}`}

function vSet(){const p=S.p;return `<h1>الإعدادات</h1><div class="card" style="display:flex;flex-direction:column;gap:12px">
 <label>الوزن (كغ)<input id="w" type="number" inputmode="decimal" value="${p.w}"></label>
 <label>هدف الخطوات اليومي<input id="g" type="number" inputmode="numeric" value="${p.goal}"></label>
 <label>طول الخطوة (م)<input id="s" type="number" step="0.05" inputmode="decimal" value="${p.stride}"></label>
 <button class="p" data-a="saveset">حفظ الإعدادات</button></div>
 <div class="card" style="display:flex;flex-direction:column;gap:10px"><h2>نسخ احتياطي</h2><p class="mu" style="margin:0">انسخ النص واحفظه، ثم الصقه هنا لاستعادة بياناتك.</p>
 <textarea id="bk" aria-label="بيانات النسخ الاحتياطي"></textarea><div class="row"><button style="flex:1" data-a="exp">تصدير</button><button style="flex:1" data-a="imp">استعادة</button></div><div id="msg" class="mu"></div></div>
 <div class='card' style='display:flex;flex-direction:column;gap:12px'><h2>الصوت</h2><label>مستوى الصوت<input id='vol' type='range' min='0' max='100' value='${Math.round((S.p.vol??.5)*100)}' style='width:150px' aria-label='مستوى الصوت'></label><label>النغمة<select id='tn'>${[['sine','هادئة'],['triangle','ناعمة'],['bell','جرس']].map(o=>`<option value='${o[0]}' ${(S.p.tone||'sine')===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></label><button data-a='snd'>${S.p.snd===false?'الصوت: متوقف':'الصوت: مفعّل'}</button></div>
 <div class='card' style='display:flex;flex-direction:column;gap:12px'><h2>تذكير المشي</h2><label>الوقت<input id='rt' type='time' value='${(S.p.rem||{}).time||'18:00'}'></label><button data-a='rem'>${(S.p.rem||{}).on?'التذكير: مفعّل':'التذكير: متوقف'}</button><p class='mu' style='margin:0'>يعمل التذكير أثناء فتح التطبيق وبحسب إذن الإشعارات.</p></div>
 <button data-a="theme">تبديل الوضع الفاتح/الداكن</button><button data-a="reset">إعادة تعيين كل البيانات</button>`}

function render(live){
 const a=document.activeElement;if(live&&a&&a.matches('input,textarea'))return;
 const f={home:vHome,track:vTrack,stats:vStats,set:vSet}[tab];
 const h=f();if(live&&h===window._h)return;window._h=h;$('#v').innerHTML=h;
 const nv=$('#nav');if(!nv.firstChild)nv.innerHTML='<span id="ind"></span>'+TABS.map(t=>`<button data-t="${t[0]}" aria-label="${t[1]}" title="${t[1]}">${IC[t[0]]}</button>`).join('');
 nv.querySelectorAll('button').forEach(b=>{if(b.dataset.t===tab)b.setAttribute('aria-current','true');else b.removeAttribute('aria-current')});
 const ab=nv.querySelector('[aria-current]'),ind=$('#ind');ind.style.width=ab.offsetWidth+'px';ind.style.left=ab.offsetLeft+'px';
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.t){play('tab',TABS.findIndex(x=>x[0]===b.dataset.t));return go(b.dataset.t)}
 play({start:'start',pause:'pause',stop:'stop',del:'del',reset:b.dataset.c?'del':'tap'}[b.dataset.a]||'tap');
 const a=b.dataset.a,msg=t=>{const m=$('#msg');if(m)m.textContent=t};
 if(a==='start')start();else if(a==='track')go('track');
 else if(a==='pause'){T.pause=!T.pause;render()}
 else if(a==='stop')stop();
 else if(a==='saveset'){S.p={...S.p,w:+$('#w').value||70,goal:+$('#g').value||10000,stride:+$('#s').value||0.75};save();msg('تم الحفظ')}
 else if(a==='exp'){$('#bk').value=JSON.stringify(S);$('#bk').select();try{navigator.clipboard.writeText($('#bk').value);msg('تم النسخ')}catch(x){msg('انسخ النص يدوياً')}}
 else if(a==='imp'){try{const o=JSON.parse($('#bk').value);if(!o.days||!o.p)throw 0;S=o;save();msg('تمت الاستعادة')}catch(x){msg('النص غير صالح')}}
 else if(a==='del'){const s=S.sessions.splice(+b.dataset.i,1)[0];if(s){const d=day(dk(new Date(s.t)));d.steps=Math.max(0,d.steps-s.steps);d.dist=Math.max(0,d.dist-s.dist);d.secs=Math.max(0,d.secs-s.secs);save();render()}}
 else if(a==='reset'){if(!b.dataset.c){b.dataset.c=1;b.textContent='اضغط مرة أخرى للتأكيد';setTimeout(()=>{delete b.dataset.c;b.textContent='إعادة تعيين كل البيانات'},4000)}else{S={days:{},sessions:[],p:S.p};save();render()}}
 else if(a==='mp'){cm=new Date(cm.getFullYear(),cm.getMonth()-1,1);render()}
 else if(a==='mn'){cm=new Date(cm.getFullYear(),cm.getMonth()+1,1);render()}
 else if(a==='cha'){const st=+$('#cs').value,dy=+$('#cd').value;if(st>0&&dy>0&&dy<=365){(S.ch=S.ch||[]).unshift({name:st.toLocaleString('en')+' خطوة × '+dy+' أيام',steps:st,days:dy,start:dk()});save();render();toast('بدأ التحدي')}else toast('أدخل قيماً صحيحة')}
 else if(a==='chd'){S.ch.splice(+b.dataset.i,1);save();render()}
 else if(a==='rem'){const r=S.p.rem||{time:'18:00'};r.on=!r.on;S.p.rem=r;save();if(r.on&&window.Notification&&Notification.permission==='default')Notification.requestPermission();render();toast(r.on?'تم تفعيل التذكير':'تم إيقاف التذكير')}
 else if(a==='snd'){S.p.snd=S.p.snd===false;save();render();play('ok')}
 else if(a==='theme'){const r=document.documentElement,d=getComputedStyle(r).getPropertyValue('--bg').trim()==='#0F1F1A';r.dataset.theme=d?'light':'dark'}
});
window.addEventListener('resize',()=>{const a=$('#nav [aria-current]');if(a){$('#ind').style.width=a.offsetWidth+'px';$('#ind').style.left=a.offsetLeft+'px'}});
function toast(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=m;t.className='on';clearTimeout(t._h);t._h=setTimeout(()=>{t.className=''},3500)}
let cm=new Date();
function chInfo(c){const s=new Date(c.start+'T00:00:00');let n=0;for(let i=0;i<c.days;i++){const d=new Date(s);d.setDate(s.getDate()+i);if((S.days[dk(d)]||{steps:0}).steps>=c.steps)n++}const e=new Date(s);e.setDate(s.getDate()+c.days-1);return{n,done:n>=c.days,over:dk()>dk(e)&&n<c.days}}
function chk(){(S.ch||[]).forEach(c=>{if(!c.fin&&chInfo(c).done){c.fin=1;save();toast('أنجزت التحدي: '+c.name);play('goal')}})}
function vCh(){const L=(S.ch||[]).map((c,i)=>{const f=chInfo(c),p=Math.min(100,Math.round(f.n/c.days*100));return `<div style='display:flex;flex-direction:column;gap:6px'><div class='row sp'><b>${c.name}</b><button data-a='chd' data-i='${i}' aria-label='حذف التحدي' style='min-height:44px;padding:0 14px;font-size:14px'>حذف</button></div><div class='mu'>${f.n} من ${c.days} أيام${f.done?' · مكتمل':f.over?' · انتهى':''}</div><div style='height:10px;border-radius:6px;background:var(--track);overflow:hidden'><i style='display:block;height:100%;width:${p}%;background:var(--ac)'></i></div></div>`}).join('');
 return `<div class='card' style='display:flex;flex-direction:column;gap:12px'><h2>التحديات</h2>${L||`<div class='mu'>لا توجد تحديات. ابدأ تحدياً جديداً.</div>`}<div class='row'><label style='flex:1'>خطوات<input id='cs' type='number' inputmode='numeric' value='10000' style='width:84px'></label><label style='flex:1'>أيام<input id='cd' type='number' inputmode='numeric' value='7' style='width:84px'></label></div><button class='p' data-a='cha'>ابدأ التحدي</button></div>`}
function vCal(){const y=cm.getFullYear(),mo=cm.getMonth(),n=new Date(y,mo+1,0).getDate(),off=(new Date(y,mo,1).getDay()+1)%7;let t=0,ds=0,ac=0,hit=0,c='';for(let i=0;i<off;i++)c+='<span></span>';
 for(let d=1;d<=n;d++){const k=y+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),x=S.days[k]||{steps:0,dist:0},r=x.steps/S.p.goal;t+=x.steps;ds+=x.dist;if(x.steps>0)ac++;if(r>=1)hit++;c+=`<span class='cd ${r>=1?'f':r>0?'h':''} ${k===dk()?'n':''}'>${d}</span>`}
 const bs='min-height:44px;padding:0 14px;font-size:14px';
 return `<div class='card' style='display:flex;flex-direction:column;gap:10px'><div class='row sp'><button data-a='mp' style='${bs}'>السابق</button><h2>${new Date(y,mo,1).toLocaleDateString('ar',{month:'long',year:'numeric'})}</h2><button data-a='mn' style='${bs}'>التالي</button></div><div class='g7 mu' style='font-size:12px'>${['س','ح','ن','ث','ر','خ','ج'].map(x=>`<span>${x}</span>`).join('')}</div><div class='g7'>${c}</div><div class='mu' style='font-size:13px'>${t.toLocaleString('en')} خطوة · ${km(ds)} كم · ${ac} أيام نشطة · ${hit} أيام حققت الهدف</div></div>`}
document.addEventListener('change',e=>{const i=e.target.id;if(i==='vol'){S.p.vol=e.target.value/100;save();play('ok')}else if(i==='tn'){S.p.tone=e.target.value;save();play('ok')}else if(i==='rt'){S.p.rem=Object.assign(S.p.rem||{on:0},{time:e.target.value,last:''});save()}});
document.addEventListener('visibilitychange',()=>{if(T.on&&!document.hidden&&navigator.wakeLock)navigator.wakeLock.request('screen').then(l=>{T.wl=l}).catch(()=>{})});
setInterval(()=>{const r=S.p.rem;if(!r||!r.on)return;const hm=new Date().toTimeString().slice(0,5);if(hm===r.time&&r.last!==dk()){r.last=dk();save();const m='حان وقت المشي! هدفك اليوم '+S.p.goal.toLocaleString('en')+' خطوة';toast(m);play('goal');try{if(window.Notification&&Notification.permission==='granted')new Notification('خطواتي',{body:m})}catch(e){}}},20000);
render();$('#v').className='t-home';
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})})</script>
